<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>remoteexec</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- ===== Main / table view ===== -->
  <div id="view-main" class="view">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">remoteexec</span>
        <span class="brand-sub">jobs</span>
      </div>
      <div class="topbar-right">
        <div class="filter">
          <button id="filter-btn" class="btn">
            Filter <span id="filter-count" class="chip"></span>
            <span class="caret">▾</span>
          </button>
          <div id="filter-menu" class="filter-menu hidden">
            <label><input type="checkbox" value="running" /> Running</label>
            <label><input type="checkbox" value="finished_6h" /> Recently finished (6h)</label>
            <label><input type="checkbox" value="finished_1d" /> Recently finished (1d)</label>
            <label><input type="checkbox" value="finished_7d" /> Recently finished (7d)</label>
          </div>
        </div>
        <button id="refresh-btn" class="btn icon" title="Refresh">⟳</button>
        <button class="btn icon theme-toggle" title="Toggle light/dark" aria-label="Toggle color scheme">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <span id="updated" class="updated"></span>
      </div>
    </header>

    <div class="table-wrap">
      <table id="jobs-table">
        <thead>
          <tr>
            <th>Status</th>
            <th>Job name</th>
            <th>Project path</th>
            <th>Started</th>
            <th>Running</th>
            <th>Environment</th>
            <th>Job ID</th>
            <th>Host</th>
            <th>Partition</th>
          </tr>
        </thead>
        <tbody id="jobs-body"></tbody>
      </table>
      <div id="empty" class="empty hidden">No jobs match the current filter.</div>
    </div>
  </div>

  <!-- ===== Detail / console view ===== -->
  <div id="view-detail" class="view hidden">
    <header class="topbar">
      <div class="brand">
        <button id="back-btn" class="btn icon" title="Back">←</button>
        <span id="detail-name" class="brand-name"></span>
        <span id="detail-status" class="pill"></span>
      </div>
      <div class="topbar-right">
        <button class="btn icon theme-toggle" title="Toggle light/dark" aria-label="Toggle color scheme">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <div class="menu">
          <button id="menu-btn" class="btn icon" title="Actions">⋯</button>
          <div id="menu-list" class="menu-list hidden">
            <button id="copy-workdir">Copy remote workdir</button>
            <button id="copy-logfile">Copy log path</button>
            <button id="copy-project">Copy local project path</button>
            <div class="menu-sep"></div>
            <button id="cancel-job" class="danger">Cancel job</button>
          </div>
        </div>
      </div>
    </header>
    <div class="meta" id="detail-meta"></div>
    <div id="console-note" class="console-note hidden"></div>
    <pre id="console" class="console"></pre>
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
