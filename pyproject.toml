[project]
name = "remoteexec"
version = "0.2.0"
description = "Edit code locally, run it on a remote Slurm cluster."
readme = "README.md"
requires-python = ">=3.10"
# cloudpickle must be able to read what the remote env reads; axon's default
# conda `base` ships 2.2.1, so allow 2.2+ for cross-env parity.
dependencies = ["cloudpickle>=2.2", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
# The CLI and GUI are stdlib-only; the extras stay so old install commands work.
cli = []
gui = []

[project.scripts]
remoteexec = "remoteexec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remoteexec"]
